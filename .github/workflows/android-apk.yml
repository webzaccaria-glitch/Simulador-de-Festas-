name: Android APK (debug)
on:
  push:
    branches: ["**"]
    paths: ["android/**", "src/**", "capacitor.config.ts", "package.json", ".github/workflows/android-apk.yml"]
  workflow_dispatch:
    inputs:
      server_url:
        description: "URL HTTPS do servidor publicado (CAP_SERVER_URL). Vazio = só interface local."
        required: false
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
        env:
          CAP_SERVER_URL: ${{ github.event.inputs.server_url || vars.CAP_SERVER_URL }}
      - run: cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: festdecor3d-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
