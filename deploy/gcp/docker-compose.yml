# FestDecor3D em uma VM do Compute Engine: app (SQLite em disco persistente) + Caddy (HTTPS automático).
services:
  app:
    build: ../..
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8080"
      DATA_DIR: /data
      APP_URL: https://${DOMAIN}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    volumes:
      - /srv/festdecor/data:/data
    expose:
      - "8080"
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/festdecor/caddy:/data
    depends_on:
      - app
